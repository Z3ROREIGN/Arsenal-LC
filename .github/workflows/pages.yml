name: Deploy web build (pygbag) to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes antes do build
        run: python -m unittest discover -s tests
      - name: Instalar pygbag
        run: python -m pip install pygbag
      - name: Montar pasta do jogo (só main.py e o pacote)
        run: |
          mkdir -p dist_src
          cp main.py dist_src/
          cp -r arsenal_lc dist_src/
      - name: Build web
        run: python -m pygbag --build dist_src
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist_src/build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
